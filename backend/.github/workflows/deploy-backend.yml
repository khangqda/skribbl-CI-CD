name: Deploy Backend to Azure App Service

on:
  push:
    branches:
      - main # (Nếu nhánh chính của bác tên là master thì đổi chữ main thành master nhé)
    paths:
      - 'backend/**' # Chỉ chạy khi có thay đổi trong thư mục backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'

    - name: Install dependencies
      run: |
        cd backend
        npm install

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'skribbl-game' # Thay tên con App Service Backend trên Azure vào đây
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./backend